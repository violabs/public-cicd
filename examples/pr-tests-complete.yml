# Example: Complete PR Tests Workflow
# This example shows how to use all the reusable workflows together
# Copy this to your repository's .github/workflows/ directory and customize as needed

name: Module PR Tests
run-name: PR Tests for modules by ${{ github.actor }}

on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Check if backend code changed (anything outside frontend/, .github/, docs/)
  check-backend:
    name: Check Backend Changes
    uses: violabs/public-cicd/.github/workflows/check-changes.yml@main
    with:
      mode: exclude
      exclude-patterns: '^(frontend/|\.github/|docs/)'

  # Check if frontend code changed
  check-frontend:
    name: Check Frontend Changes
    uses: violabs/public-cicd/.github/workflows/check-changes.yml@main
    with:
      mode: include
      include-patterns: '^frontend/'

  # Fast-fail build check
  build-check:
    name: Build Check
    needs: check-backend
    if: needs.check-backend.outputs.changed == 'true'
    uses: violabs/public-cicd/.github/workflows/gradle-build.yml@main
    with:
      java-version: '21'
      build-tasks: 'classes testClasses componentTestClasses'
      gradle-args: '--no-daemon'

  # Determine which modules changed
  determine-modules:
    name: Determine Changed Modules
    needs: [check-backend, build-check]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine affected modules
        id: set-matrix
        run: |
          # Your custom logic to determine changed modules
          # Should output a JSON array like:
          # [{"module": ":app", "path": "app", "filename": "app"}, ...]
          echo "matrix=$(./gradlew -q detectChangedModules | grep 'MATRIX=' | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"

  # Unit tests with matrix strategy
  unit-tests:
    needs: [check-backend, build-check, determine-modules]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success' && needs.determine-modules.outputs.matrix != '[]'
    uses: violabs/public-cicd/.github/workflows/gradle-matrix-tests.yml@main
    with:
      java-version: '21'
      modules-json: ${{ needs.determine-modules.outputs.matrix }}
      exclude-tasks: 'npmInstall testComponents'
      coverage-enabled: true
      min-coverage-overall: 40
      min-coverage-changed-files: 40

  # Component tests
  component-tests:
    needs: [check-backend, build-check]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success'
    uses: violabs/public-cicd/.github/workflows/gradle-component-tests.yml@main
    with:
      java-version: '21'
      exclude-tasks: 'npmInstall'

  # Frontend tests
  frontend-tests:
    needs: check-frontend
    if: needs.check-frontend.outputs.changed == 'true'
    uses: violabs/public-cicd/.github/workflows/frontend-tests-npm.yml@main
    with:
      node-version: '22'
      working-directory: 'frontend'
      cache-dependency-path: 'frontend/package-lock.json'
      test-command: 'npm run test:coverage'
      install-playwright: true
      playwright-browsers: 'chromium'

  # Detekt static analysis with matrix
  detekt-check:
    needs: determine-modules
    if: needs.determine-modules.outputs.matrix != '[]'
    uses: violabs/public-cicd/.github/workflows/gradle-detekt-matrix.yml@main
    with:
      java-version: '21'
      modules-json: ${{ needs.determine-modules.outputs.matrix }}
      fail-fast: true

  # Discord notification
  notify-discord:
    name: Notify Discord
    needs: [check-backend, build-check, unit-tests, component-tests, frontend-tests, detekt-check]
    if: always()
    uses: violabs/public-cicd/.github/workflows/notify-discord.yml@main
    with:
      workflow_name: ${{ github.workflow }}
      build_result: ${{ needs.build-check.result }}
      test_result: ${{ needs.unit-tests.result }}
      component_test_result: ${{ needs.component-tests.result }}
      frontend_result: ${{ needs.frontend-tests.result }}
      detekt_result: ${{ needs.detekt-check.result }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.PRIVATE_BUILD_HOOK_URL }}
