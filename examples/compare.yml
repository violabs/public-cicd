name: Module PR Tests
run-name: PR Tests for modules by ${{ github.actor }}

on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Check if backend code changed (anything outside frontend/)
  check-backend:
    name: Check Backend Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: check-changes
        run: |
          # Check for any changes outside of frontend/, .github/, and docs/
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qvE '^(frontend/|\.github/|docs/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast-fail build check - compiles without tests to catch build errors quickly
  build-check:
    name: Build Check
    needs: check-backend
    if: needs.check-backend.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile project (no tests)
        run: ./gradlew classes testClasses componentTestClasses --no-daemon

  determine-modules:
    name: Determine Changed Modules
    needs: [check-backend, build-check]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine affected modules
        id: set-matrix
        run: |
          echo "matrix=$(./gradlew -q detectChangedModules | grep 'MATRIX=' | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"

      - name: Debug Output
        run: |
          echo "Gradle Modules: ${{ fromJson(steps.set-matrix.outputs.matrix) }}"

  # Unit tests - fast, no testcontainers
  unit-tests:
    needs: [check-backend, build-check, determine-modules]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success' && needs.determine-modules.outputs.matrix != '[]'
    name: Unit Tests ${{ matrix.module-namespace.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module-namespace: ${{ fromJson(needs.determine-modules.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            */build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests for ${{ matrix.module-namespace.module == ':src' && 'src' || matrix.module-namespace.module }}
        run: >-
          if [ "${{ matrix.module-namespace.module }}" == ":src" ]; then
            ./gradlew test -Pkover koverXmlReport -x npmInstall -x testComponents
          else
            ./gradlew ${{ matrix.module-namespace.module }}:test -Pkover ${{ matrix.module-namespace.module }}:koverXmlReport -x npmInstall -x testComponents
          fi
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.module-namespace.filename }}
          path: ${{ matrix.module-namespace.path }}/build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.module-namespace.filename }}
          path: ${{ matrix.module-namespace.path }}/build/reports/kover/

      - name: Check if coverage report exists
        id: check-coverage
        run: |
          REPORT_PATH="${{ github.workspace }}/${{ matrix.module-namespace.path }}/build/reports/kover/report.xml"
          if [ -f "$REPORT_PATH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Coverage report not found at $REPORT_PATH"
          fi

      - name: Add coverage report to PR
        if: steps.check-coverage.outputs.exists == 'true'
        uses: mi-kas/kover-report@v1.9
        with:
          path: |
            ${{ github.workspace }}/${{ matrix.module-namespace.path }}/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage - ${{ matrix.module-namespace.module }}
          update-comment: true
          min-coverage-overall: 40
          min-coverage-changed-files: 40
          coverage-counter-type: LINE

  # Component tests
  component-tests:
    needs: [check-backend, build-check]
    if: needs.check-backend.outputs.changed == 'true' && needs.build-check.result == 'success'
    name: Component Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            */build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run component tests
        run: ./gradlew testComponents -x npmInstall
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-reports
          path: build/reports/tests/

  check-frontend:
    name: Check Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for frontend changes
        id: check-changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^frontend/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-tests:
    needs: check-frontend
    if: needs.check-frontend.outputs.changed == 'true'
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Vitest tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  detekt-check:
    name: Detekt ${{ matrix.module-namespace.module }}
    needs: determine-modules
    if: needs.determine-modules.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module-namespace: ${{ fromJson(needs.determine-modules.outputs.matrix) }}
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt for ${{ matrix.module-namespace.module }}
        run: >-
          if [ "${{ matrix.module-namespace.module }}" == ":src" ]; then
            ./gradlew detekt --no-daemon
          else
            ./gradlew ${{ matrix.module-namespace.module }}:detekt --no-daemon 2>/dev/null ||
            echo "No detekt task for ${{ matrix.module-namespace.module }}, running root detekt" &&
            ./gradlew detekt --no-daemon
          fi

  notify-discord:
    name: Notify Discord
    needs: [check-backend, build-check, unit-tests, component-tests, frontend-tests, detekt-check]
    if: always()
    uses: ./.github/workflows/notify-discord.yml
    with:
      workflow_name: ${{ github.workflow }}
      build_result: ${{ needs.build-check.result }}
      test_result: ${{ needs.unit-tests.result }}
      component_test_result: ${{ needs.component-tests.result }}
      frontend_result: ${{ needs.frontend-tests.result }}
      detekt_result: ${{ needs.detekt-check.result }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.PRIVATE_BUILD_HOOK_URL }}
