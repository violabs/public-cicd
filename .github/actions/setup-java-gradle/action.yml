name: 'Setup Java and Gradle'
description: 'Sets up Java, Gradle, and caching for Gradle builds'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  java-distribution:
    description: 'Java distribution to use'
    required: false
    default: 'temurin'
  gradle-cache-enabled:
    description: 'Enable Gradle caching'
    required: false
    default: 'true'
  additional-cache-paths:
    description: 'Additional paths to cache (newline-separated)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Stop Gradle daemons
      shell: bash
      run: pkill -f GradleDaemon || true

    - name: Cleanup corrupted Gradle caches
      shell: bash
      run: |
        rm -rf ~/.gradle/caches/modules-2/files-2.1
        rm -rf ~/.gradle/caches/jars-*
        rm -rf ~/.gradle/caches/transforms-*
        rm -rf ~/.gradle/caches/build-cache-*

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Cache Gradle packages
      if: inputs.gradle-cache-enabled == 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle
          build
          */build
          ${{ inputs.additional-cache-paths }}
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
