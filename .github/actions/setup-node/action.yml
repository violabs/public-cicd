name: 'Setup Node.js'
description: 'Sets up Node.js with npm caching'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory for npm operations'
    required: false
    default: '.'
  cache-dependency-path:
    description: 'Path to package-lock.json for caching'
    required: false
    default: 'package-lock.json'
  cache:
    description: 'Enable npm caching (set to empty string to disable)'
    required: false
    default: 'npm'
  install-dependencies:
    description: 'Whether to run npm ci'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Check if lock file exists
      id: check-lock
      shell: bash
      run: |
        if [ -f "${{ inputs.cache-dependency-path }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Lock file found: ${{ inputs.cache-dependency-path }}"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::Lock file not found at '${{ inputs.cache-dependency-path }}'. Caching disabled. Ensure package-lock.json exists and path is correct."
        fi

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.check-lock.outputs.exists == 'true' && inputs.cache != '' && inputs.cache || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: npm ci
