name: Gradle Component Tests

on:
  workflow_call:
    inputs:
      test-name:
        description: 'Display name for this test type'
        required: false
        type: string
        default: 'Component Tests'
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      test-task:
        description: 'Gradle test task to run'
        required: false
        type: string
        default: 'testComponents'
      exclude-tasks:
        description: 'Tasks to exclude (space-separated)'
        required: false
        type: string
        default: ''
      gradle-args:
        description: 'Additional Gradle arguments'
        required: false
        type: string
        default: ''
      upload-test-reports:
        description: 'Upload test reports as artifacts'
        required: false
        type: boolean
        default: true
      artifact-name:
        description: 'Name for the test reports artifact'
        required: false
        type: string
        default: 'component-test-reports'
      reports-path:
        description: 'Path to test reports'
        required: false
        type: string
        default: 'build/reports/tests/'
      runs-on:
        description: 'Runner to use (string or JSON array for labels)'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  component-tests:
    name: ${{ inputs.test-name }}
    runs-on: ${{ contains(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: violabs/public-cicd/.github/actions/setup-java-gradle@main
        with:
          java-distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Build exclude tasks string
        id: exclude
        run: |
          EXCLUDES=""
          if [ -n "${{ inputs.exclude-tasks }}" ]; then
            for task in ${{ inputs.exclude-tasks }}; do
              EXCLUDES="$EXCLUDES -x $task"
            done
          fi
          echo "args=$EXCLUDES" >> "$GITHUB_OUTPUT"

      - name: Run ${{ inputs.test-name }}
        run: ./gradlew ${{ inputs.test-task }} ${{ steps.exclude.outputs.args }} ${{ inputs.gradle-args }}

      - name: Upload test reports
        if: always() && inputs.upload-test-reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.reports-path }}
